<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* THE SCREEN IS THE FACE - solid color background */
    body {
      background: #FF6B35;  /* Face color - can change based on mood */
      position: relative;
      transition: background 0.6s ease;
    }

    /* Eyes - simple black ovals/circles */
    .eyes {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 25vw;
    }

    .eye {
      width: 12vw;
      height: 12vw;
      background: #000;
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Eye animations */
    .eye.blink {
      height: 2vw;
      border-radius: 50%;
    }

    .eye.wide {
      width: 15vw;
      height: 15vw;
    }

    .eye.squint {
      height: 5vw;
    }

    /* Mouth - simple black shape */
    .mouth {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 30vw;
      height: 8vw;
      background: transparent;
      border-bottom: 1.5vw solid #000;
      border-radius: 0 0 15vw 15vw;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Mouth expressions */
    .mouth.smile {
      height: 12vw;
      border-radius: 0 0 20vw 20vw;
    }

    .mouth.open {
      border: 1.5vw solid #000;
      border-radius: 50%;
      width: 15vw;
      height: 15vw;
    }

    .mouth.flat {
      border-radius: 0;
      height: 0;
      border-bottom: 1.5vw solid #000;
      width: 20vw;
    }

    .mouth.frown {
      border-bottom: none;
      border-top: 1.5vw solid #000;
      border-radius: 15vw 15vw 0 0;
      height: 8vw;
    }

    /* Text overlay */
    .text {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 6vw;
      font-family: 'Arial Black', sans-serif;
      font-weight: 900;
      color: #000;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.3vw;
    }

    .text.show {
      opacity: 1;
    }

    /* Input */
    input {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 30px;
      font-size: 24px;
      font-family: 'Arial Black', sans-serif;
      font-weight: bold;
      border: 4px solid #000;
      border-radius: 50px;
      background: white;
      color: #000;
      width: 80%;
      max-width: 600px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    input.show {
      opacity: 1;
      pointer-events: all;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.2);
    }

    /* Morphing animations */
    @keyframes morph-happy {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }

    .eyes.happy {
      animation: morph-happy 0.6s ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(-5deg); }
      75% { transform: translateX(-50%) rotate(5deg); }
    }

    .mouth.wiggle {
      animation: wiggle 0.4s ease-in-out;
    }

    @keyframes talk {
      0%, 100% { height: 8vw; }
      50% { height: 15vw; }
    }

    .mouth.talking {
      animation: talk 0.5s ease-in-out infinite;
    }

    @keyframes pulse-bg {
      0%, 100% { background: #FF6B35; }
      50% { background: #FF8C42; }
    }

    body.excited {
      animation: pulse-bg 1s ease-in-out;
    }
  </style>
</head>
<body>
  <!-- The entire screen IS the face -->
  <!-- Just simple shapes positioned on it -->
  
  <div class="eyes" id="eyes">
    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>
  </div>

  <div class="mouth" id="mouth"></div>
  
  <div class="text" id="text"></div>
  
  <input type="text" id="input" placeholder="Type something..." />

  <script>
    const eyes = document.getElementById('eyes');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const mouth = document.getElementById('mouth');
    const text = document.getElementById('text');
    const input = document.getElementById('input');
    const body = document.body;

    let blinkTimer;
    let sleepTimer;

    // Show/hide input
    function showInput() {
      input.classList.add('show');
      input.focus();
    }

    function hideInput() {
      input.classList.remove('show');
      input.blur();
    }

    // Show text
    function showText(msg, duration = 3000) {
      text.textContent = msg;
      text.classList.add('show');
      
      if (duration > 0) {
        setTimeout(() => {
          text.classList.remove('show');
        }, duration);
      }
    }

    // Blink
    function blink() {
      leftEye.classList.add('blink');
      rightEye.classList.add('blink');
      
      setTimeout(() => {
        leftEye.classList.remove('blink');
        rightEye.classList.remove('blink');
      }, 150);
    }

    // Auto blink
    function startBlinking() {
      stopBlinking();
      blinkTimer = setInterval(() => {
        blink();
      }, 3000 + Math.random() * 2000);
    }

    function stopBlinking() {
      clearInterval(blinkTimer);
    }

    // Sleep mode
    function goToSleep() {
      stopBlinking();
      leftEye.classList.add('squint');
      rightEye.classList.add('squint');
      mouth.classList.add('flat');
      showText('💤', 0);
    }

    function wakeUp() {
      leftEye.classList.remove('squint');
      rightEye.classList.remove('squint');
      mouth.className = 'mouth';
      text.classList.remove('show');
      startBlinking();
      resetSleepTimer();
    }

    function resetSleepTimer() {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(goToSleep, 30000);
    }

    // Expressions
    function express(emotion) {
      // Reset
      eyes.className = 'eyes';
      mouth.className = 'mouth';
      leftEye.className = 'eye';
      rightEye.className = 'eye';
      body.className = '';

      switch(emotion) {
        case 'happy':
          leftEye.classList.add('wide');
          rightEye.classList.add('wide');
          mouth.classList.add('smile');
          eyes.classList.add('happy');
          body.classList.add('excited');
          break;
        
        case 'surprised':
          leftEye.classList.add('wide');
          rightEye.classList.add('wide');
          mouth.classList.add('open');
          break;
        
        case 'talking':
          mouth.classList.add('talking');
          break;
        
        case 'thinking':
          mouth.classList.add('flat');
          break;
        
        case 'neutral':
          // Just default state
          break;
      }
    }

    // Handle input
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        const msg = input.value.trim();
        input.value = '';
        hideInput();
        handleMessage(msg);
      } else if (e.key === 'Escape') {
        hideInput();
      }
    });

    // Process message
    async function handleMessage(msg) {
      wakeUp();
      
      // Happy to receive message
      express('happy');
      showText(msg, 2000);
      
      await sleep(2500);
      
      // Think
      express('thinking');
      showText('...', 1000);
      
      await sleep(1500);
      
      // Respond
      express('talking');
      const responses = ['HI!', 'COOL!', 'WOW!', 'YEAH!', 'AWESOME!', 'NICE!', 'FUN!', 'OK!'];
      showText(responses[Math.floor(Math.random() * responses.length)], 3000);
      
      await sleep(3500);
      
      express('neutral');
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // Click to interact
    document.addEventListener('click', (e) => {
      if (e.target !== input) {
        wakeUp();
        showInput();
      }
    });

    // Wake on keypress
    document.addEventListener('keydown', (e) => {
      if (e.target !== input && e.key !== 'Escape') {
        wakeUp();
        showInput();
      }
    });

    // Initialize
    startBlinking();
    resetSleepTimer();
    
    // Welcome
    setTimeout(() => {
      showText('HI!', 3000);
      mouth.classList.add('wiggle');
      setTimeout(() => mouth.classList.remove('wiggle'), 400);
    }, 500);
  </script>
</body>
</html>
