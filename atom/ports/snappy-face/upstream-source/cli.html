<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy CLI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #2C2416; }

    .face-container {
      position: absolute; top: 0; left: 0; right: 0; height: 90vh;
      background: #FF8C42;
      display: flex; align-items: center; justify-content: center;
    }
    
    .face-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-8vh);
    }
    
    .eyes { 
      display: flex; 
      gap: 150px;
      margin-bottom: 100px;
    }
    
    .eye {
      width: 200px; height: 200px; background: white; border-radius: 50%;
      position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    
    .pupil {
      width: 80px; height: 80px; background: #2C2416; border-radius: 50%;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      transition: all 0.3s ease;
    }
    
    .pupil::after {
      content: ''; position: absolute; top: 15px; left: 25px;
      width: 25px; height: 25px; background: white; border-radius: 50%;
    }
    
    .mouth {
      width: 250px; height: 60px; border-bottom: 12px solid #2C2416;
      border-radius: 0 0 250px 250px; transition: all 0.4s ease;
    }

    .cli-container {
      position: absolute; top: 90vh; left: 0; right: 0; bottom: 0;
      background: #3D3226; display: flex; flex-direction: column;
      border-top: 4px solid #FF8C42;
    }
    .cli-container:not(.dragging) {
      transition: all 0.3s ease;
    }
    .cli-container.collapsed {
      top: 100vh;
      transition: all 0.3s ease;
    }
    body.cli-collapsed .face-container {
      height: 100vh;
      transition: all 0.3s ease;
    }
    .face-container:not(.dragging) {
      transition: all 0.3s ease;
    }
    .output {
      flex: 1; padding: 15px 20px; overflow-y: auto; color: #FFB84D;
      font-size: 13px; line-height: 1.5; min-height: 0;
    }
    .output-line { margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; }
    .output-line.user { color: #FFD93D; }
    .output-line.assistant { color: #FFF8F0; }
    .output-line.system { color: #C9B8A0; }
    .output-line.error { color: #D95B43; }

    .input-area {
      padding: 12px 20px; background: #2C2416; border-top: 2px solid #FF8C42;
      display: flex; align-items: center; gap: 10px; min-height: 50px;
    }
    .prompt { color: #FF8C42; font-weight: bold; font-size: 16px; }
    #input {
      flex: 1; background: transparent; border: none; color: #FFD93D;
      font-family: 'Courier New', monospace; font-size: 14px; outline: none;
    }
    #input::placeholder { color: #8B7355; }

    .status-bar {
      position: absolute; top: 10px; right: 10px; padding: 8px 15px;
      background: rgba(44, 36, 22, 0.9); color: #FFB84D; border-radius: 15px;
      font-size: 12px; z-index: 10; border: 2px solid #FF8C42;
    }
    .status-bar.connected { color: #FFD93D; }
    .status-bar.error { color: #D95B43; }
    .status-bar.processing { color: #FFB84D; }

    .fullscreen-btn {
      position: absolute; top: 10px; left: 10px; padding: 8px 15px;
      background: rgba(44, 36, 22, 0.9); color: #FFD93D; border: 2px solid #FF8C42;
      border-radius: 15px; font-size: 18px; cursor: pointer; z-index: 10;
      transition: all 0.3s;
    }
    .fullscreen-btn:hover { background: rgba(61, 50, 38, 0.95); transform: scale(1.05); }

    .collapse-btn {
      position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
      padding: 5px 20px; background: rgba(44, 36, 22, 0.9); color: #FFD93D;
      border: 2px solid #FF8C42; border-bottom: none; border-radius: 15px 15px 0 0; 
      font-size: 14px; cursor: ns-resize; transition: background 0.2s; font-family: monospace;
      font-weight: bold; user-select: none;
    }
    .collapse-btn:hover { background: rgba(61, 50, 38, 0.95); }
    .collapse-btn.dragging { cursor: grabbing; background: rgba(255, 140, 66, 0.3); transition: none; }
    .cli-container.collapsed .collapse-btn { top: -35px; cursor: pointer; }

    /* States */
    .face-container.thinking { background: #9B59B6; }
    .face-container.processing { background: #3498DB; }
    .face-container.happy { background: #FFD93D; }
    .face-container.excited { background: #FFD93D; }
    .face-container.sad { background: #8B9DC3; }

    .eye.blink { height: 10px; transition: all 0.15s ease-out; }
    .eye.blink .pupil { opacity: 0; }

    .mouth.happy { height: 80px; border-bottom-width: 15px; }
    .mouth.excited { width: 350px; height: 100px; border-bottom-width: 18px; }
    .mouth.sad { border-bottom: none; border-top: 12px solid #2C2416; border-radius: 150px 150px 0 0; }

    /* Fullscreen */
    body:fullscreen .face-container, body:-webkit-full-screen .face-container { height: 90vh; }
    body:fullscreen .cli-container, body:-webkit-full-screen .cli-container { top: 90vh; }
    body:fullscreen.cli-collapsed .face-container, body:-webkit-full-screen.cli-collapsed .face-container { height: 100vh; }

    .output::-webkit-scrollbar { width: 8px; }
    .output::-webkit-scrollbar-track { background: #2C2416; }
    .output::-webkit-scrollbar-thumb { background: #FF8C42; border-radius: 4px; }
    .output::-webkit-scrollbar-thumb:hover { background: #FFB84D; }
  </style>
</head>
<body>
  <div class="face-container" id="face">
    <button class="fullscreen-btn" id="fsBtn" title="F11 for fullscreen">⛶</button>
    <div class="status-bar" id="status">Ready</div>
    <div class="face-content">
      <div class="eyes">
        <div class="eye" id="leftEye"><div class="pupil"></div></div>
        <div class="eye" id="rightEye"><div class="pupil"></div></div>
      </div>
      <div class="mouth" id="mouth"></div>
    </div>
  </div>

  <div class="cli-container" id="cli">
    <button class="collapse-btn" id="collapseBtn">═</button>
    <div class="output" id="output">
      <div class="output-line system">Snappy CLI - Connected to Clawdbot</div>
      <div class="output-line system">Type commands below...</div>
      <div class="output-line system">---</div>
    </div>
    <div class="input-area">
      <span class="prompt">></span>
      <input type="text" id="input" placeholder="Type a command..." autofocus />
    </div>
  </div>

  <script>
    const CONFIG = {
      url: 'http://localhost:8788/v1/chat/completions',  // CORS proxy (run cors-proxy.js)
      token: 'YOUR_GATEWAY_TOKEN_HERE'  // Get from: clawdbot gateway config.get (See SETUP.md)
    };

    const face = document.getElementById('face');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const mouth = document.getElementById('mouth');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const input = document.getElementById('input');
    const fsBtn = document.getElementById('fsBtn');
    const cli = document.getElementById('cli');
    const collapseBtn = document.getElementById('collapseBtn');

    let history = [];
    let state = 'idle';

    function log(text, type = '') {
      const line = document.createElement('div');
      line.className = `output-line ${type}`;
      line.textContent = text;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function setState(s) {
      state = s;
      face.className = `face-container ${s}`;
      mouth.className = `mouth ${s}`;
    }

    function blink() {
      leftEye.classList.add('blink');
      rightEye.classList.add('blink');
      setTimeout(() => {
        leftEye.classList.remove('blink');
        rightEye.classList.remove('blink');
      }, 150);
    }

    setInterval(blink, 3000 + Math.random() * 2000);

    async function send(msg) {
      try {
        log(`> ${msg}`, 'user');
        setState('processing');
        status.textContent = 'Thinking...';
        status.className = 'status-bar processing';

        history.push({ role: 'user', content: msg });

        console.log('Sending to:', CONFIG.url);
        console.log('Request:', { model: 'clawdbot:main', messages: history });

        const res = await fetch(CONFIG.url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.token}`
          },
          body: JSON.stringify({
            model: 'clawdbot:main',
            messages: history,
            user: 'snappy-cli'
          })
        });

        console.log('Response status:', res.status);

        if (!res.ok) {
          const errorText = await res.text();
          console.error('Error response:', errorText);
          throw new Error(`HTTP ${res.status}: ${errorText.substring(0, 100)}`);
        }

        const data = await res.json();
        console.log('Response data:', data);
        const reply = data.choices?.[0]?.message?.content || 'No response';

        history.push({ role: 'assistant', content: reply });

        log(reply, 'assistant');
        
        const emotion = reply.toLowerCase().includes('error') ? 'sad' : 
                       reply.includes('!') ? 'excited' : 'happy';
        setState(emotion);
        status.textContent = 'Ready';
        status.className = 'status-bar connected';

        setTimeout(() => setState('idle'), 3000);

      } catch (err) {
        console.error('Full error:', err);
        setState('sad');
        status.textContent = 'Error';
        status.className = 'status-bar error';
        
        let errorMsg = err.message;
        if (err.message.includes('Failed to fetch')) {
          errorMsg = 'Connection failed. Make sure Clawdbot gateway is running (clawdbot gateway status)';
        }
        
        log(`Error: ${errorMsg}`, 'error');
        log(`Check browser console (F12) for details`, 'system');
        
        setTimeout(() => {
          setState('idle');
          status.textContent = 'Retry';
          status.className = 'status-bar error';
        }, 5000);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        send(input.value.trim());
        input.value = '';
      }
    });

    // Collapse CLI & Draggable Resize
    let cliCollapsed = false;
    let isDragging = false;
    let dragStartY = 0;
    let dragStartHeight = 10; // Initial CLI height in vh

    collapseBtn.addEventListener('mousedown', (e) => {
      // Detect if it's a quick click vs drag
      dragStartY = e.clientY;
      const clickTimeout = setTimeout(() => {
        isDragging = true;
        collapseBtn.classList.add('dragging');
        cli.classList.add('dragging');
        face.classList.add('dragging');
        document.body.style.cursor = 'ns-resize';
      }, 150); // 150ms to distinguish click from drag

      const onMouseMove = (e) => {
        if (!isDragging) return;

        const deltaY = dragStartY - e.clientY;
        const viewportHeight = window.innerHeight;
        const deltaVh = (deltaY / viewportHeight) * 100;
        
        let newHeight = dragStartHeight + deltaVh;
        newHeight = Math.max(5, Math.min(50, newHeight)); // Clamp between 5vh and 50vh

        cli.style.top = `${100 - newHeight}vh`;
        face.style.height = `${100 - newHeight}vh`;
      };

      const onMouseUp = () => {
        clearTimeout(clickTimeout);
        
        if (!isDragging) {
          // It was a click, not a drag - toggle collapse
          cliCollapsed = !cliCollapsed;
          cli.classList.toggle('collapsed');
          document.body.classList.toggle('cli-collapsed');
          collapseBtn.textContent = cliCollapsed ? '▲' : '═';
          
          if (!cliCollapsed) {
            // Reset to current dragged size
            const currentTop = parseFloat(cli.style.top) || 90;
            dragStartHeight = 100 - currentTop;
          }
        } else {
          // Finished dragging - save the new height
          const currentTop = parseFloat(cli.style.top) || 90;
          dragStartHeight = 100 - currentTop;
        }

        isDragging = false;
        collapseBtn.classList.remove('dragging');
        cli.classList.remove('dragging');
        face.classList.remove('dragging');
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    // Fullscreen
    fsBtn.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        fsBtn.click();
      } else if (e.key === 'Escape' && cliCollapsed) {
        collapseBtn.click();
      } else if ((e.key === 'c' || e.key === 'C') && document.activeElement !== input) {
        collapseBtn.click();
      }
    });

    // Mouse tracking
    document.addEventListener('mousemove', (e) => {
      document.querySelectorAll('.pupil').forEach(pupil => {
        const eye = pupil.parentElement;
        const rect = eye.getBoundingClientRect();
        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;
        
        const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
        const distance = Math.min(20, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 15);
        
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        
        pupil.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      });
    });

    // Test connection on load
    (async () => {
      try {
        console.log('Testing connection to Clawdbot...');
        status.textContent = 'Connecting...';
        status.className = 'status-bar processing';
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout
        
        const testRes = await fetch(CONFIG.url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.token}`
          },
          body: JSON.stringify({
            model: 'clawdbot:main',
            messages: [{ role: 'user', content: 'ping' }],
            max_tokens: 5,
            user: 'snappy-cli-init'
          }),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (testRes.ok) {
          console.log('✅ Connected to Clawdbot!');
          status.textContent = 'Ready';
          status.className = 'status-bar connected';
          setState('happy');
          setTimeout(() => setState('idle'), 2000);
        } else {
          const errorText = await testRes.text();
          console.error('Connection error:', testRes.status, errorText);
          throw new Error(`HTTP ${testRes.status}`);
        }
      } catch (err) {
        console.error('❌ Connection failed:', err);
        if (err.name === 'AbortError') {
          status.textContent = 'Timeout - Try typing anyway';
          status.className = 'status-bar error';
          log('Connection test timed out, but you can still try typing commands', 'system');
          setState('idle');
        } else {
          status.textContent = 'Ready (untested)';
          status.className = 'status-bar error';
          log('Could not test connection, but you can try typing commands', 'system');
          log('If commands fail, check: clawdbot gateway status', 'system');
          setState('idle');
        }
      }
    })();
  </script>
</body>
</html>
