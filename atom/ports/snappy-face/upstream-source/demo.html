<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    /* THE ENTIRE SCREEN IS THE FACE */
    body {
      background: #FF8C42;  /* Face color */
      position: relative;
      cursor: default;  /* Visible cursor */
      transition: background 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);  /* Smooth color transitions */
    }

    /* Eyes Container */
    .eyes {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Individual Eye */
    .eye {
      width: 180px;
      height: 180px;
      background: white;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Pupil */
    .pupil {
      width: 80px;
      height: 80px;
      background: #2C2416;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Highlight */
    .pupil::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 20px;
      width: 25px;
      height: 25px;
      background: white;
      border-radius: 50%;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 80px;
      border-bottom: 12px solid #2C2416;
      border-radius: 0 0 300px 300px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Mouth states */
    .mouth.talking {
      animation: talk 0.3s ease-in-out infinite;
    }

    @keyframes talk {
      0%, 100% {
        height: 80px;
        border-radius: 0 0 300px 300px;
      }
      50% {
        height: 120px;
        border-radius: 0 0 200px 200px;
      }
    }

    .mouth.happy {
      height: 100px;
      border-radius: 0 0 400px 400px;
      border-bottom-width: 15px;
    }

    .mouth.surprised {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 12px solid #2C2416;
      border-bottom-width: 12px;
    }

    /* Blinking - pupils hide when eyes close */
    .eye.blink {
      height: 20px;
      transition: all 0.15s ease-out;
    }

    .eye.blink .pupil {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      transition: all 0.15s ease-out;
    }

    /* Text display */
    .text-display {
      position: absolute;
      top: 8%;  /* Very high up, well above eyes */
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;  /* Smaller, more readable */
      font-weight: 700;
      color: #2C2416;
      text-align: center;
      line-height: 1.4;
      text-shadow: 
        3px 3px 0 rgba(255, 255, 255, 0.9),
        -1px -1px 0 rgba(255, 255, 255, 0.9);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      max-width: 80%;
      word-wrap: break-word;
      padding: 20px;
      z-index: 10;  /* Make sure text is always on top */
    }

    .text-display.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .text-display.hide {
      opacity: 0;
      transform: translateX(-50%) scale(0.8);
    }

    /* Input (hidden until click) */
    .input-container {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      max-width: 90%;
      padding: 20px;
      background: rgba(44, 36, 22, 0.95);
      border-radius: 30px 30px 0 0;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 1000;
    }

    .input-container.show {
      bottom: 0;
    }

    #textInput {
      width: 100%;
      padding: 15px 20px;
      font-size: 1.2rem;
      font-family: inherit;
      border: none;
      border-radius: 20px;
      background: white;
      color: #2C2416;
      font-weight: bold;
    }

    #textInput::placeholder {
      color: #999;
      font-weight: normal;
    }

    #textInput:focus {
      outline: 3px solid #FF8C42;
    }

    /* Sleeping state */
    body.sleeping {
      background: #FF8C42;  /* Keep default color */
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { background: #FF8C42; }
      50% { background: #E67A35; }
    }

    .eye.sleeping {
      height: 8px;
      background: #2C2416;
    }

    .eye.sleeping .pupil {
      display: none;
    }

    .mouth.sleeping {
      width: 80px;
      height: 8px;
      border-radius: 4px;
      border: none;
      background: #2C2416;
    }

    /* Sad state */
    .eye.sad {
      transform: scale(0.9);
    }

    .mouth.sad {
      width: 200px;
      height: 60px;
      border-bottom: none;
      border-top: 10px solid #2C2416;
      border-radius: 100px 100px 0 0;
      transform: translateX(-50%) translateY(10px);
    }

    body.sad {
      background: #8B9DC3;  /* Blue-ish sad color */
    }

    /* Angry state */
    .eye.angry {
      width: 150px;
      height: 120px;
      transform: rotate(-10deg);
    }

    .eye.angry:first-child {
      transform: rotate(10deg);
    }

    .mouth.angry {
      width: 240px;
      height: 40px;
      border-radius: 0;
      border-bottom: 15px solid #2C2416;
      transform: translateX(-50%) translateY(-10px);
    }

    body.angry {
      background: #D95B43;  /* Red-ish angry color */
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* Confused state */
    .eye.confused:first-child {
      width: 200px;
      height: 200px;
    }

    .eye.confused:last-child {
      width: 140px;
      height: 140px;
      transform: translateY(20px);
    }

    .mouth.confused {
      width: 120px;
      height: 40px;
      border-radius: 60px;
      border-left: 10px solid #2C2416;
      border-bottom: none;
      transform: translateX(-50%) rotate(-20deg);
    }

    /* Excited state */
    .eye.excited {
      width: 220px;
      height: 220px;
      animation: wiggle-eyes 0.4s ease-in-out infinite;
    }

    @keyframes wiggle-eyes {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .mouth.excited {
      width: 400px;
      height: 120px;
      border-bottom: 18px solid #2C2416;
      border-radius: 0 0 400px 400px;
      animation: excited-bounce 0.3s ease-in-out infinite;
    }

    @keyframes excited-bounce {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    body.excited {
      background: #FFD93D;  /* Bright yellow excited */
    }
    
    /* Optional: Add subtle pulse for excited (disabled for smoother transitions) */
    /* Uncomment below to enable pulsing:
    body.excited {
      animation: pulse-excited 0.6s ease-in-out infinite;
    }

    @keyframes pulse-excited {
      0%, 100% { background: #FFD93D; }
      50% { background: #FFC107; }
    }
    */

    /* Thinking state */
    .eye.thinking {
      transform: translateY(-20px);
    }

    .mouth.thinking {
      width: 100px;
      height: 10px;
      border-radius: 5px;
      border: none;
      background: #2C2416;
    }

    /* Love/Heart eyes state */
    .eye.love {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF1744 100%);
      width: 200px;
      height: 200px;
      animation: heartbeat 0.8s ease-in-out infinite;
    }

    .eye.love .pupil {
      display: none;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .mouth.love {
      width: 300px;
      height: 100px;
      border-bottom: 15px solid #FF1744;
      border-radius: 0 0 300px 300px;
    }

    body.love {
      background: #FFCCE5;  /* Pink background */
    }

    /* Squash and stretch animation */
    @keyframes squashStretch {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1, 1);
      }
      25% {
        transform: translate(-50%, -50%) scale(1.1, 0.9);
      }
      75% {
        transform: translate(-50%, -50%) scale(0.9, 1.1);
      }
    }

    .eyes.excited {
      animation: squashStretch 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Look around animation */
    @keyframes lookAround {
      0%, 100% {
        transform: translate(-50%, -50%);
      }
      20% {
        transform: translate(-45%, -52%);
      }
      40% {
        transform: translate(-55%, -48%);
      }
      60% {
        transform: translate(-52%, -50%);
      }
      80% {
        transform: translate(-48%, -50%);
      }
    }

    .eyes.looking {
      animation: lookAround 4s ease-in-out infinite;
    }

    /* Bounce animation */
    @keyframes bounce {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-30px);
      }
    }

    .eyes.bounce {
      animation: bounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <!-- THE ENTIRE SCREEN IS THE FACE - just eyes and mouth positioned on it -->
  
  <div class="eyes" id="eyes">
    <div class="eye" id="leftEye">
      <div class="pupil"></div>
    </div>
    <div class="eye" id="rightEye">
      <div class="pupil"></div>
    </div>
  </div>

  <div class="mouth" id="mouth"></div>

  <div class="text-display" id="textDisplay"></div>

  <div class="input-container" id="inputContainer">
    <input 
      type="text" 
      id="textInput" 
      placeholder="Give me a command... (e.g., 'check my calendar', 'search for news about AI')"
      autocomplete="off"
    />
  </div>

  <script>
    // ============================================
    // CLAWDBOT CONFIGURATION
    // ============================================
    // Set USE_CLAWDBOT to true to connect to Clawdbot Gateway
    // Set to false to use mock responses (for testing)
    const USE_CLAWDBOT = true;  // Change to false to disable
    
    const CLAWDBOT_CONFIG = {
      baseUrl: 'http://localhost:18789',  // Your Clawdbot Gateway URL
      token: 'YOUR_GATEWAY_TOKEN_HERE',    // Get from: clawdbot gateway config.get (See SETUP.md)
      model: 'clawdbot:main',              // Agent ID
      timeout: 30000                       // Response timeout (30 seconds)
    };
    
    // ============================================
    // DOM ELEMENTS
    // ============================================
    const eyes = document.getElementById('eyes');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const mouth = document.getElementById('mouth');
    const textDisplay = document.getElementById('textDisplay');
    const inputContainer = document.getElementById('inputContainer');
    const textInput = document.getElementById('textInput');
    const body = document.body;

    let state = 'idle';
    let blinkInterval;
    let lookInterval;
    let sleepTimeout;

    // State management
    function setState(newState) {
      // Clear previous state classes
      mouth.className = 'mouth';
      eyes.className = 'eyes';
      body.className = '';
      leftEye.className = 'eye';
      rightEye.className = 'eye';

      state = newState;

      switch(newState) {
        case 'idle':
          startBlinking();
          startLooking();
          resetSleepTimer();
          break;
        
        case 'happy':
          mouth.classList.add('happy');
          eyes.classList.add('bounce');
          setTimeout(() => eyes.classList.remove('bounce'), 600);
          break;
        
        case 'talking':
          mouth.classList.add('talking');
          break;
        
        case 'surprised':
          mouth.classList.add('surprised');
          eyes.classList.add('excited');
          setTimeout(() => eyes.classList.remove('excited'), 600);
          break;
        
        case 'sleeping':
          stopBlinking();
          stopLooking();
          body.classList.add('sleeping');
          leftEye.classList.add('sleeping');
          rightEye.classList.add('sleeping');
          mouth.classList.add('sleeping');
          break;
        
        case 'sad':
          body.classList.add('sad');
          leftEye.classList.add('sad');
          rightEye.classList.add('sad');
          mouth.classList.add('sad');
          break;
        
        case 'angry':
          body.classList.add('angry');
          leftEye.classList.add('angry');
          rightEye.classList.add('angry');
          mouth.classList.add('angry');
          break;
        
        case 'confused':
          leftEye.classList.add('confused');
          rightEye.classList.add('confused');
          mouth.classList.add('confused');
          break;
        
        case 'excited':
          body.classList.add('excited');
          leftEye.classList.add('excited');
          rightEye.classList.add('excited');
          mouth.classList.add('excited');
          break;
        
        case 'thinking':
          leftEye.classList.add('thinking');
          rightEye.classList.add('thinking');
          mouth.classList.add('thinking');
          break;
        
        case 'love':
          body.classList.add('love');
          leftEye.classList.add('love');
          rightEye.classList.add('love');
          mouth.classList.add('love');
          break;
      }
    }

    // Blinking
    function blink() {
      leftEye.classList.add('blink');
      rightEye.classList.add('blink');
      
      setTimeout(() => {
        leftEye.classList.remove('blink');
        rightEye.classList.remove('blink');
      }, 150);
    }

    function startBlinking() {
      stopBlinking();
      blinkInterval = setInterval(() => {
        if (state !== 'sleeping') {
          blink();
        }
      }, 3000 + Math.random() * 2000);
    }

    function stopBlinking() {
      if (blinkInterval) clearInterval(blinkInterval);
    }

    // Looking around
    function startLooking() {
      stopLooking();
      eyes.classList.add('looking');
    }

    function stopLooking() {
      eyes.classList.remove('looking');
    }

    // Sleep timer
    function resetSleepTimer() {
      clearTimeout(sleepTimeout);
      if (state === 'sleeping') {
        setState('idle');
      }
      sleepTimeout = setTimeout(() => {
        setState('sleeping');
        showText('💤');
        setTimeout(() => hideText(), 3000);
      }, 30000); // 30 seconds
    }

    // Text display
    function showText(text, duration = 4000) {
      textDisplay.textContent = text;
      textDisplay.classList.remove('hide');
      textDisplay.classList.add('show');
      
      if (duration > 0) {
        setTimeout(() => hideText(), duration);
      }
    }

    function hideText() {
      textDisplay.classList.remove('show');
      textDisplay.classList.add('hide');
    }

    // Handle input
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && textInput.value.trim()) {
        const message = textInput.value.trim();
        textInput.value = '';
        handleMessage(message);
      } else if (e.key === 'Escape') {
        inputContainer.classList.remove('show');
        textInput.blur();
      }
    });

    // ============================================
    // CLAWDBOT INTEGRATION (HTTP API)
    // ============================================
    
    // Detect emotion from response text
    function detectEmotion(text) {
      const lower = text.toLowerCase();
      
      // Negative responses
      if (lower.includes('error') || lower.includes('failed') || lower.includes('cannot') || lower.includes('unable')) {
        return 'sad';
      }
      if (lower.includes('sorry') || lower.includes('unfortunately') || lower.includes('no results')) {
        return 'sad';
      }
      
      // Excited/positive responses
      if (lower.includes('done!') || lower.includes('success') || lower.includes('completed')) {
        return 'excited';
      }
      if (lower.includes('!') && (lower.includes('found') || lower.includes('created') || lower.includes('great'))) {
        return 'excited';
      }
      
      // Confused/uncertain
      if (lower.includes('?') || lower.includes('hmm') || lower.includes('not sure')) {
        return 'confused';
      }
      
      // Processing/thinking
      if (lower.includes('searching') || lower.includes('checking') || lower.includes('looking')) {
        return 'thinking';
      }
      
      // Love/appreciation
      if (lower.includes('love') || lower.includes('❤') || lower.includes('awesome')) {
        return 'love';
      }
      
      return 'happy';
    }
    
    // Send message to Clawdbot with full tool support
    async function getClawdbotResponse(message) {
      if (!USE_CLAWDBOT) {
        return getMockResponse(message);
      }
      
      try {
        console.log('📡 Sending command to Clawdbot:', message);
        
        const response = await fetch(`${CLAWDBOT_CONFIG.baseUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CLAWDBOT_CONFIG.token}`
          },
          body: JSON.stringify({
            model: CLAWDBOT_CONFIG.model,
            messages: [
              {
                role: 'system',
                content: 'You are Snappy, a helpful AI assistant. Be concise and friendly. When you complete a task, confirm what you did. Keep responses under 50 words when possible.'
              },
              {
                role: 'user',
                content: message
              }
            ],
            user: 'snappy-interface',  // Session persistence
            stream: false,
            temperature: 0.7
          })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        const text = data.choices?.[0]?.message?.content || 'Sorry, I could not process that.';
        const emotion = detectEmotion(text);
        
        console.log('✅ Response:', text);
        
        return { text, emotion };
        
      } catch (error) {
        console.error('❌ Clawdbot error:', error);
        console.log('📦 Falling back to mock responses');
        return getMockResponse(message);
      }
    }
    
    // Mock responses (for testing without Clawdbot)
    function getMockResponse(message) {
      const msgLower = message.toLowerCase();
      
      // Emotion-based responses
      if (msgLower.includes('sad') || msgLower.includes('cry') || msgLower.includes('upset')) {
        return { text: "I'm sorry to hear that...", emotion: 'sad' };
      }
      if (msgLower.includes('angry') || msgLower.includes('mad') || msgLower.includes('annoyed')) {
        return { text: "That's frustrating!", emotion: 'angry' };
      }
      if (msgLower.includes('love') || msgLower.includes('❤') || msgLower.includes('heart')) {
        return { text: "Aww, love you too!", emotion: 'love' };
      }
      if (msgLower.includes('?') || msgLower.includes('confused') || msgLower.includes('what')) {
        return { text: "Hmm, good question...", emotion: 'confused' };
      }
      if (msgLower.includes('!') || msgLower.includes('wow') || msgLower.includes('amazing')) {
        return { text: "SO EXCITING!!!", emotion: 'excited' };
      }
      if (msgLower.includes('think') || msgLower.includes('wonder') || msgLower.includes('why')) {
        return { text: "Let me think about that...", emotion: 'thinking' };
      }
      
      // Default happy responses
      const responses = [
        { text: 'Hello!', emotion: 'happy' },
        { text: 'That\'s interesting!', emotion: 'surprised' },
        { text: 'I hear you!', emotion: 'happy' },
        { text: 'Tell me more!', emotion: 'excited' },
        { text: 'Cool!', emotion: 'happy' },
        { text: 'Awesome!', emotion: 'excited' },
        { text: 'I understand!', emotion: 'happy' },
        { text: 'Nice!', emotion: 'happy' },
        { text: 'Great!', emotion: 'excited' }
      ];
      return responses[Math.floor(Math.random() * responses.length)];
    }
    
    // ============================================
    // MESSAGE HANDLING
    // ============================================
    
    // Handle message
    async function handleMessage(message) {
      inputContainer.classList.remove('show');
      resetSleepTimer();
      
      // Show user command briefly
      setState('listening');
      showText(`"${message}"`, 1500);
      
      await sleep(2000);
      
      // Process command
      setState('processing');
      showText('Executing...', 0);  // Keep showing while processing
      
      try {
        // Execute command via Clawdbot
        let response = await getClawdbotResponse(message);
        let emotion = 'happy';
        let text = response;
        
        // Handle response format
        if (typeof response === 'object' && response.text) {
          text = response.text;
          emotion = response.emotion || 'happy';
        }
        
        // Show result with appropriate emotion
        setState(emotion);
        showText(text, 8000);  // Show longer for command results
        
        await sleep(8500);
        
      } catch (error) {
        console.error('Error executing command:', error);
        setState('sad');
        showText('Sorry, something went wrong...', 3000);
        await sleep(3500);
      }
      
      setState('idle');
    }

    // Utility
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Mouse tracking (follow cursor with eyes)
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      if (state === 'idle' || state === 'happy') {
        movePupils(mouseX, mouseY);
      }
    });

    function movePupils(x, y) {
      const pupils = document.querySelectorAll('.pupil');
      
      pupils.forEach((pupil, index) => {
        const eye = pupil.parentElement;
        const rect = eye.getBoundingClientRect();
        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;
        
        const angle = Math.atan2(y - eyeY, x - eyeX);
        const distance = Math.min(30, Math.hypot(x - eyeX, y - eyeY) / 10);
        
        const pupilX = Math.cos(angle) * distance;
        const pupilY = Math.sin(angle) * distance;
        
        pupil.style.transform = `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`;
      });
    }

    // Click anywhere to show input and wake up
    document.addEventListener('click', (e) => {
      if (e.target !== textInput) {
        // Wake from sleep if needed
        if (state === 'sleeping') {
          setState('idle');
          showText('Hello!', 2000);
        }
        
        resetSleepTimer();
        inputContainer.classList.add('show');
        setTimeout(() => textInput.focus(), 100);
      }
    });

    // Wake from sleep on any keypress
    document.addEventListener('keydown', (e) => {
      if (state === 'sleeping' && e.target !== textInput) {
        setState('idle');
        showText('Hello!', 2000);
      }
    });

    // ============================================
    // INITIALIZE
    // ============================================
    
    // Clawdbot HTTP API - no connection needed, works on-demand
    if (USE_CLAWDBOT) {
      console.log('✅ Clawdbot integration enabled');
      console.log('🔗 Gateway:', CLAWDBOT_CONFIG.baseUrl);
    }
    
    // Start face animations
    setState('idle');
    
    // Welcome message
    setTimeout(() => {
      setState('happy');
      showText('Hi! I\'m Snappy. Click to give me commands!', 4000);
      setTimeout(() => setState('idle'), 4500);
    }, 500);
  </script>
</body>
</html>
