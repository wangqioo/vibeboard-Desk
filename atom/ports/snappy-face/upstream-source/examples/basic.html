<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainsy Face - Basic Example</title>
  <link rel="stylesheet" href="../brainsy-face.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2A2D3A;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #00CED1;
      margin-bottom: 30px;
    }

    #brainsy-container {
      margin: 30px 0;
    }

    button {
      background: #00CED1;
      color: #2A2D3A;
      border: none;
      padding: 12px 24px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    button:hover {
      background: #FF6B9D;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🤖 Brainsy Face - Basic Example</h1>
  
  <div id="brainsy-container"></div>
  
  <div>
    <button onclick="face.setState('happy')">😄 Happy</button>
    <button onclick="face.setState('thinking')">🤔 Thinking</button>
    <button onclick="face.setState('speaking')">💬 Speaking</button>
    <button onclick="face.blink()">👁️ Blink</button>
  </div>

  <script src="../brainsy-face.js"></script>
  <script>
    // Initialize Brainsy Face
    const face = new BrainsyFace('brainsy-container');
    
    // Log events to console
    face.on('stateChange', ({ state }) => {
      console.log('State changed to:', state);
    });
    
    face.on('blink', () => {
      console.log('Blinked!');
    });
  </script>
</body>
</html>
