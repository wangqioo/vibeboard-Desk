<!DOCTYPE html>
<html>
    <head><script src="webgl2-compat.js"></script>
        <meta charset="utf-8">
        <title>Fluid Paint</title>

        <meta name="description" content="Fluid paint simulation">
        <link rel="stylesheet" href="paint.css">
    </head>

    <body>
        <script type="text/template" id="main">
            <div id="ui">
                <div id="clear-button" class="button">Clear</div><div id="save-button" class="button">Save</div>

                <div class="control-label">Quality</div>
                <div class="buttons" id="qualities"></div>
                <div style="clear:both"></div>

                <div class="control-label">Color Mode</div>
                <div class="buttons" id="models"></div>
                <div style="clear:both"></div>

                <div class="control-label">Paint Fluidity</div>
                <div id="fluidity-slider" class="slider"></div>

                <div class="control-label">Bristle Count</div>
                <div id="bristles-slider" class="slider"></div>

                <div class="control-label">Brush Size</div>
                <div id="size-slider" class="slider"></div>

                <div class="control-label">Paint Color</div>

                <div id="undo-button" class="button">Undo</div><div id="redo-button" class="button">Redo</div>
            </div>


            <div id="instructions">
                <span>Click and hold</span> to paint <br/>
                <span>Scroll</span> to change brush size<br/>
                <span>Space + drag</span> to pan<br/>
                <span>Drag edges</span> to resize canvas
            </div>

            <div id="footer">
                <a href="http://david.li">david.li</a> | <a href="http://github.com/dli/paint">Source code</a>
            </div>
        </script>

        <script type="text/template" id="no-support">
            <div id="no-support-container">
                <div id="error"></div>
                <div id="backlink"><a href="http://david.li">Back to david.li</a></div>
            </div>
        </script>

        <div id="placeholder"></div>


        <script crossorigin="anonymous" src="wrappedgl.js"></script>
        <script crossorigin="anonymous" src="utilities.js"></script>
        <script crossorigin="anonymous" src="rectangle.js"></script>
        <script crossorigin="anonymous" src="brush.js"></script>
        <script crossorigin="anonymous" src="simulator.js"></script>
        <script crossorigin="anonymous" src="colorpicker.js"></script>
        <script crossorigin="anonymous" src="slider.js"></script>
        <script crossorigin="anonymous" src="buttons.js"></script>
        <!--<script crossorigin="anonymous" src="brushviewer.js"></script>-->
        <script crossorigin="anonymous" src="paint.js"></script>

        <script>
            'use strict';

            var canvas = document.createElement('canvas');
            var wgl = WrappedGL.create(canvas);

            if (wgl !== null && wgl.hasFloatTextureSupport()) { //required features are supported
                document.body.appendChild(canvas);
                document.getElementById('placeholder').outerHTML = document.getElementById('main').innerHTML;
                var painter = new Paint(canvas, wgl);
            } else { //required features unsupported
                document.getElementById('placeholder').outerHTML = document.getElementById('no-support').innerHTML;

                if (wgl === null) {
                    document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL.';
                } else {
                    document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL floating point textures.';
                }
            }
        </script>

    <style>html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif}#ui,#instructions,#footer{display:none!important}canvas{position:absolute;left:0;top:0}.tools{position:fixed;bottom:10px;left:12px;right:12px;display:flex;gap:6px;z-index:10}button{height:40px;border:1px solid #ffffff80;border-radius:8px;padding:0 10px;background:#23313be8;color:white;font:13px sans-serif}.color{width:36px;flex-shrink:0}.title{position:fixed;top:10px;left:14px;z-index:10;font:13px sans-serif;color:#25313b;pointer-events:none}</style><div class="title">颜料画室 · 拖动绘画 · 滚轮调笔刷</div><div class="tools"><button class="color" style="background:#ee3355" onclick="painter.brushColorHSVA=[.97,.85,1,.8]"></button><button class="color" style="background:#267be9" onclick="painter.brushColorHSVA=[.6,.85,1,.8]"></button><button class="color" style="background:#ffca28" onclick="painter.brushColorHSVA=[.13,.9,1,.8]"></button><button onclick="painter.brushScale=painter.brushScale===22?40:22;this.textContent=painter.brushScale===22?'细笔':'粗笔'">细笔</button><button onclick="painter.undo()">撤销</button><button onclick="painter.redo()">重做</button><button onclick="painter.clear()">清空</button></div></body>
</html>
