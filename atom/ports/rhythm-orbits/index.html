<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节奏轨道</title><link rel="stylesheet" href="style.css"></head><body><div class="atomtitle"><strong>节奏轨道</strong><span id="readout">Euclidean / MIDI → 本地合成</span></div><canvas id="orbits" width="480" height="270"></canvas><div class="atomtools"><div class="row"><button id="play">开始演奏</button><button id="random">变换节奏</button><button id="mute">静音轨道</button><label>BPM <input id="bpm" type="number" min="45" max="180" value="105"></label></div><div class="row"><label>步数 <input id="steps" type="range" min="4" max="24" value="16"></label><label>击打 <input id="pulses" type="range" min="0" max="16" value="4"></label><button id="rotate">旋转一格</button></div></div><div id="error" hidden></div><script crossorigin="anonymous" src="upstream-core.js"></script><script crossorigin="anonymous" src="main.js"></script></body></html>
