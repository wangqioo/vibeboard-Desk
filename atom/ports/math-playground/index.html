<!doctype html><html><head><meta charset="utf-8"><title>数学游乐场</title><script crossorigin="anonymous" src="Cindy.js"></script><script crossorigin="anonymous" src="CindyGL.js"></script><style>html,body{margin:0;overflow:hidden;height:100%;font:13px sans-serif;background:var(--bg);color:var(--ink)}.head{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between}#scene{position:absolute;top:36px;left:0;width:100%;height:272px}#scene canvas{width:100%;height:100%}.atomtools{position:absolute;bottom:8px;left:10px;right:10px;display:flex;gap:6px}.atomtools button{height:38px;flex:1;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}#hint{font-size:11px;color:var(--muted)}</style></head><body><div class="head"><span>数学游乐场</span><span id="hint">拖动橙色点，改变分形</span></div><div id="scene"></div><div class="atomtools"><button data-mode="julia">复数分形</button><button data-mode="rays">光线包络</button><button data-mode="triangle">三角几何</button><button id="reset">重置</button></div><script src="main.js"></script></body></html>
