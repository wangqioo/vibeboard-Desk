<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>点阵生命</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font:13px sans-serif;background:var(--bg);color:var(--ink)}.head{position:absolute;top:9px;left:12px;right:12px;display:flex;justify-content:space-between}#world{position:absolute;top:52px;left:0;width:100%;height:240px;touch-action:none}#hint{position:absolute;top:33px;left:18px;font-size:11px;color:var(--muted)}.atomtools{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:6px}.atomtools button,.atomtools select{height:40px;min-width:0;flex:1;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:12px sans-serif}.atomtools select{flex:1.5}</style></head><body><div class="head"><span>点阵生命</span><span id="status">GPU · 64×32</span></div><div id="hint">拖动播种 · 右键擦除 · Conway生命规则</div><canvas id="world" width="512" height="256"></canvas><div class="atomtools"><select id="preset" aria-label="生命图样"><option value="gun">滑翔机枪</option><option value="pulsar">脉冲星</option><option value="ships">飞船编队</option><option value="random">随机宇宙</option></select><button id="play">暂停</button><button id="step">单步</button><button id="speed">12代/秒</button><button id="clear">清空</button></div><script crossorigin="anonymous" src="lib/igloo-0.1.0.js"></script><script crossorigin="anonymous" src="gol.js"></script><script src="main.js"></script></body></html>
