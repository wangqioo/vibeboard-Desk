<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点阵剧场</title><link rel="stylesheet" href="style.css"></head><body><div id="stage"><div class="topline"><strong>点阵剧场</strong><span id="frame-label">1 / 1</span><select id="resolution" aria-label="点阵分辨率"><option value="32">32 × 16</option><option value="64">64 × 32</option></select></div><div id="board"><canvas id="matrix" aria-label="可绘制点阵画布"></canvas></div><p id="hint">拖动绘画 · 本次打开保留</p><div class="atomtools"><button id="previous">上一帧</button><button id="next">下一帧</button><button id="add">加一帧</button><button id="play">播放</button><button id="tools">工具</button></div></div><section id="tool-panel" hidden><div class="panel-title"><strong>创作工具</strong><button id="close-tools">继续绘画</button></div><div class="tool-row"><button id="brush">画笔</button><button id="color">颜色：琥珀</button><button id="clear">清空本帧</button><button id="delete">删本帧</button></div><div class="tool-row"><button data-sample="heart">跳动爱心</button><button data-sample="walker">像素小人</button><button data-sample="rain">点阵雨</button></div><label class="text-label">文字跑马灯<input id="text" maxlength="48" value="HELLO ATOM · 你好" aria-label="跑马灯文字"></label><div class="tool-row"><button id="marquee">播放文字</button><label>速度 <input id="speed" type="range" min="2" max="14" value="7"></label></div><div class="tool-row"><button id="save">保存到本机</button><button id="project">项目 JSON</button><button id="import">导入 JSON</button></div><input id="file" type="file" accept="application/json,.json" hidden><p id="tool-message">画面在本次打开保留；可通过系统桥保存，或导出 JSON。</p></section><section id="project-panel" hidden><div class="panel-title"><strong>项目 JSON</strong><button id="close-project">完成</button></div><textarea id="project-json" aria-label="项目 JSON 内容" spellcheck="false"></textarea><p>可选择全部文本，复制后在电脑保存为 JSON。这里只提供项目文本，不自动保存。</p></section><section id="confirm-panel" hidden role="dialog" aria-modal="true" aria-label="确认操作"><div class="confirm-box"><p id="confirm-text"></p><div class="tool-row"><button id="confirm-cancel">取消</button><button id="confirm-accept">继续</button></div></div></section><div id="error" hidden></div><script crossorigin="anonymous" src="led-matrix.js"></script><script crossorigin="anonymous" src="main.js"></script></body></html>
