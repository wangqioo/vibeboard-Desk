<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--atom-paper,#ffe49b);color:var(--atom-ink,#302c22);font:14px system-ui,sans-serif;padding:14px 22px;display:flex;flex-direction:column;gap:7px}header{display:flex;align-items:baseline;justify-content:space-between}h1{font-size:23px;margin:0;letter-spacing:-1px}small,.muted{color:var(--atom-muted,#685738)}#time{font-variant-numeric:tabular-nums;font-size:18px}.meter{height:58px;display:flex;align-items:center;gap:4px;padding:12px 0}.bar{flex:1;background:var(--atom-line,#c6ad6b);height:8px;border-radius:2px}.bar.on{background:var(--atom-ink,#302c22)}.stats{display:flex;justify-content:space-between;border-top:1px solid var(--atom-line,#c6ad6b);border-bottom:1px solid var(--atom-line,#c6ad6b);padding:8px 0}.stats b{display:block;font-size:18px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}.stats small{font-size:11px}#hint{margin:0;min-height:34px;font-size:13px;line-height:1.4}.actions{display:flex;gap:10px;margin-top:auto}button{font:inherit;min-height:44px;border:1px solid var(--atom-line,#c6ad6b);border-radius:var(--atom-radius,12px);background:var(--atom-card,#ffedbd);color:inherit;padding:8px 15px;flex:1}button.primary{background:var(--atom-ink,#302c22);color:var(--atom-paper,#ffe49b)}button:disabled{opacity:.4}footer{font-size:11px;color:var(--atom-muted,#685738);display:flex;justify-content:space-between}#state{font-size:12px}body[data-active=true] #state:before{content:'● ';color:var(--atom-action,#9b431d)}@media(prefers-reduced-motion:no-preference){.bar{transition:height .1s}}
</style></head><body><header><h1>麦克风测试</h1><span id="state">等待录音</span></header><div class="meter" aria-label="收音强度"></div><div class="stats"><div><small>音量 RMS</small><b id="rms">—</b></div><div><small>峰值</small><b id="peak">—</b></div><div><small>削波比例</small><b id="clip">—</b></div><div><small>录音时长</small><b id="time">00.0 s</b></div></div><p id="hint">先保持安静 2 秒，再用正常音量说话。录完可回放，听是否清楚、有杂音。</p><div style="display:flex;align-items:center;gap:12px"><span id="fan-state" class="muted" style="flex:1;font-size:12px">检测风扇…</span><button id="fan" style="flex:0 0 132px">暂停风扇</button></div><div class="actions"><button id="record" class="primary">开始录音</button><button id="play" disabled>回放录音</button></div><footer><span>原始 PCM · 16 kHz · 最长 30 秒</span><span>空格返回</span></footer><script>
'use strict';let serial=0,pending={},rid=null,recording=false,playing=false,alive=true,tick=null,busy=false;const $=id=>document.getElementById(id),bars=document.querySelector('.meter');for(let i=0;i<32;i++){let b=document.createElement('i');b.className='bar';bars.append(b)}function call(action,fan_action){return new Promise((resolve,reject)=>{let id=++serial;let timeout=setTimeout(()=>{delete pending[id];reject(Error('设备响应超时，请重试'))},8000);pending[id]={resolve,reject,timeout};parent.postMessage({type:'atom:mic',id,action,fan_action,recording_id:rid},'*')})}window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='atom:mic-result')return;let p=pending[e.data.id];if(!p)return;clearTimeout(p.timeout);delete pending[e.data.id];e.data.error?p.reject(Error(e.data.error)):p.resolve(e.data.result)});function controls(){document.body.dataset.active=recording;$('record').textContent=recording?'停止录音':rid?'重新录音':'开始录音';$('record').disabled=busy;$('play').disabled=recording||busy||!rid;$('play').textContent=playing?'停止回放':'回放录音';$('state').textContent=recording?'正在收音':playing?'正在回放':rid?'录音已就绪':'等待录音'}function show(r){$('rms').textContent=r.rms_db+' dBFS';$('peak').textContent=r.peak_db+' dBFS';$('clip').textContent=r.clipping+'%';$('time').textContent=r.seconds.toFixed(1)+' s';let level=Math.max(0,Math.min(1,(r.rms_db+65)/55));[...bars.children].forEach((b,i)=>{b.classList.toggle('on',i<level*32);b.style.height=(8+Math.sin((i+1)/33*Math.PI)*level*60)+'px'});if(r.clipping>0.1)$('hint').textContent='出现削波：声音可能失真。试着离麦克风远一些，比较回放。';else if(recording)$('hint').textContent='正在录音：先听环境底噪，再说一句完整的话。';if(recording&&!r.recording){recording=false;$('hint').textContent='已到 30 秒，录音自动停止。可以回放原始声音。'}playing=r.playing;controls()}async function poll(){if(!alive||!rid)return;try{show(await call('meter'))}catch(e){$('hint').textContent=e.message}if(alive&&(recording||playing))tick=setTimeout(poll,160)}let fanQuiet=false,fanTimer=null,fanBusy=false;async function fanStatus(action){try{let r=await call('fan',action);fanQuiet=r.quiet;$('fan').textContent=r.quiet?'恢复自动':'暂停风扇';$('fan-state').textContent=(r.quiet?'暂停 · '+r.seconds+' 秒':r.fan_on?'自动 · 风扇开启':'自动 · 风扇关闭')+' · '+Math.max(r.cpu,r.gpu).toFixed(1)+'°C';$('fan').disabled=false;}catch(e){$('fan-state').textContent=e.message;$('fan').disabled=true;}}$('fan').onclick=async()=>{if(fanBusy)return;fanBusy=true;await fanStatus(fanQuiet?'auto':'off');fanBusy=false;};async function fanPoll(){if(!alive)return;await fanStatus('status');if(alive)fanTimer=setTimeout(fanPoll,1500)}fanPoll();
$('record').onclick=async()=>{if(busy)return;busy=true;controls();clearTimeout(tick);try{if(recording){await call('stop');recording=false;show(await call('meter'));$('hint').textContent='录音已完成。回放时留意声音大小、噪声、断续或失真。'}else{await call('quiet');let r=await call('start');rid=r.recording_id;recording=true;playing=false;poll()}}catch(e){$('hint').textContent=e.message}busy=false;controls()};$('play').onclick=async()=>{try{if(playing){await call('quiet');playing=false}else{await call('play');playing=true;poll()}controls()}catch(e){$('hint').textContent=e.message}};AtomApp.onSuspend(()=>{alive=false;clearTimeout(tick);clearTimeout(fanTimer);Object.values(pending).forEach(p=>{clearTimeout(p.timeout);p.reject(Error('应用已退出'))});pending={}});
</script></body></html>
